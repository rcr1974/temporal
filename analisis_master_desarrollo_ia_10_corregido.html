function renderBlockChart(){const rows=D.blocks.map((b,i)=>{const official=b.modules.reduce((a,m)=>a+(m.official_seconds||0),0)/3600;return {name:`${i+1}. ${b.name}`,official}});const max=Math.max(...rows.map(x=>x.official));document.getElementById('blockChart').innerHTML=rows.map(x=>`<div class="chart-row"><div class="chart-label">${esc(x.name)}</div><div class="bars"><div class="bar-line"><div class="bar-track"><div class="bar official" style="width:${(x.official/max*100).toFixed(2)}%"></div></div><div class="bar-value">${x.official.toFixed(2)} h</div></div></div></div>`).join('')}renderBlockChart();
const blockSelect=document.getElementById('block');blockSelect.innerHTML+=D.blocks.map((b,i)=>`<option value="${esc(b.name)}">${i+1}. ${esc(b.name)}</option>`).join('');
function render(){const qInput=document.getElementById('q');const typeSelect=document.getElementById('type');const statusSelect=document.getElementById('status');const blockSelect=document.getElementById('block');let q=qInput.value.trim().toLowerCase(),t=typeSelect.value,st=statusSelect.value,bf=blockSelect.value,out='';D.blocks.forEach((b,bi)=>{if(bf&&b.name!==bf)return;let ms=b.modules.filter(m=>{let hay=[b.name,m.name,...m.items.map(x=>x.name)].join(' ').toLowerCase().includes(q);return hay&&(!t||m.kind===t)&&(!st||m.status===st)});if(!ms.length)return;out+=`<section class="panel block"><button class="block-head" onclick="this.parentElement.classList.toggle('closed');this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span><span class="block-number">${bi+1}.</span> ${esc(b.name)}</span><span>${ms.length} módulos</span></button><div>`;ms.forEach(m=>{let diff=m.calculated_seconds-(m.official_seconds||0);out+=`<article class="module open"><div class="module-head" onclick="this.parentElement.classList.toggle('open')"><div><h3><span class="module-number">${m.order}.</span> ${esc(m.name)}</h3><div class=badges><span class="badge ${m.kind.toLowerCase().replace(' ','-')}">${esc(m.kind)}</span><span class="badge ${m.status.toLowerCase().replace(' ','-')}">${esc(m.status)}</span>${m.available?`<span class=badge>${esc(m.available)}</span>`:''}</div></div><b>${f(m.official_seconds)}</b></div><div class=detail><h4 class=content-title>Contenido del módulo <span class=content-count>${m.items.length} elementos</span></h4><div class=times><div class=time>Duración oficial<br><b>${f(m.official_seconds)}</b></div><div class=time>Suma exacta de lecciones<br><b>${f(m.calculated_seconds)}</b></div><div class=time>Diferencia<br><b>${(diff<0?'-':'+')+f(Math.abs(diff))}</b></div><div class=time>Sin duración<br><b>${m.items.filter(x=>x.seconds==null).length}</b></div></div>${m.items.length?`<table><thead><tr><th>#</th><th>Tipo</th><th>Contenido</th><th>Estado</th><th>Duración</th></tr></thead><tbody>${m.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.type)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:esc(x.name)}</td><td>${esc(x.status)}</td><td class="${x.seconds==null?'nodur':''}">${f(x.seconds)}</td></tr>`).join('')}</tbody></table>`:'<div class=empty>El HTML no contiene lecciones o cuestionarios detallados asociados a este módulo.</div>'}</div></article>`});out+='</div></section>'});app.innerHTML=out||'<div class="panel empty">No hay resultados con los filtros seleccionados.</div>'};document.getElementById('q').addEventListener('input',render);['type','status','block'].forEach(id=>document.getElementById(id).addEventListener('change',render));render();</script></body></html>
